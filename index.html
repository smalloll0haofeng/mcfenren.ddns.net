<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="google-site-verification" content="xbNg-Qy_Zvk4UBg96qUZpvlAr1EFF7twCcAWz00l9Fw" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>凡生存人伺服器</title>

<style>
body{
margin:0;
font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
background:#f5f7ff;
color:#111827;
}

nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 40px;
background:white;
border-bottom:1px solid #e5e7eb;
position:sticky;
top:0;
}

.logo{
font-weight:800;
letter-spacing:1px;
}

nav a{
margin-left:18px;
text-decoration:none;
color:#374151;
font-size:14px;
}

.hero{
padding:90px 20px 60px;
text-align:center;
background:linear-gradient(135deg,#c7e9ff,#eef7ff);
border-bottom-left-radius:48px;
border-bottom-right-radius:48px;
}

.hero h1{
font-size:48px;
margin:0;
}

.hero p{
opacity:0.7;
margin-top:10px;
}

.status{
display:inline-flex;
align-items:center;
gap:10px;
margin-top:18px;
padding:10px 16px;
background:white;
border-radius:999px;
box-shadow:0 10px 25px rgba(0,0,0,0.08);
font-weight:600;

opacity:0;
transform:translateY(6px);
transition:0.25s;
}

.status.show{
opacity:1;
transform:translateY(0);
}

.dot{
width:10px;
height:10px;
border-radius:50%;
background:#999;
}

.cta{
margin-top:20px;
display:flex;
gap:10px;
justify-content:center;
flex-wrap:wrap;
}

button{
padding:12px 16px;
border:none;
border-radius:12px;
cursor:pointer;
font-weight:600;
}

.primary{
background:#3b82f6;
color:white;
}

.primary:hover{
background:#2563eb;
}

.secondary{
background:#e5e7eb;
}

.section{
max-width:1100px;
margin:auto;
padding:50px 20px;
}

.title{
font-size:18px;
font-weight:700;
margin-bottom:16px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:16px;
}

.card{
background:white;
border-radius:18px;
padding:18px;
border:1px solid #e5e7eb;
box-shadow:0 8px 20px rgba(0,0,0,0.04);
}

.ip{
display:flex;
justify-content:space-between;
align-items:center;
padding:12px;
background:#f1f5ff;
border-radius:12px;
}

iframe{
width:100%;
height:520px;
border:none;
border-radius:18px;
}

footer{
text-align:center;
padding:30px;
font-size:12px;
opacity:0.5;
}
</style>
</head>

<body>

<nav>
<div class="logo">凡生存人伺服器</div>
<div>
<a href="#features">特色</a>
<a href="#tech">技術</a>
<a href="#map">地圖</a>
</div>
</nav>

<header class="hero">
<h1>一個穩定的 Minecraft 生存世界</h1>
<p>Java 與 Bedrock 跨平台 · 長期運營 · 純生存體驗</p>

<div id="status" class="status">
<div class="dot"></div>
<span>載入中</span>
</div>

<div class="cta">
<button class="primary" onclick="copyIP()">加入伺服器</button>
<button class="secondary">查看地圖</button>
</div>
</header>

<section class="section" id="features">
<div class="title">核心特色</div>

<div class="grid">

<div class="card">
<b>跨平台支援</b>
<p>Java 與 Bedrock 玩家可共同遊玩</p>
</div>

<div class="card">
<b>穩定運行</b>
<p>長期開放伺服器，低延遲連線</p>
</div>

<div class="card">
<b>純生存玩法</b>
<p>無過度插件干擾，回歸原始樂趣</p>
</div>

</div>
</section>

<section class="section" id="tech">
<div class="title">技術架構</div>

<div class="grid">

<div class="card">
<b>Geyser</b>
<p>讓基岩版玩家直接加入 Java 伺服器</p>
</div>

<div class="card">
<b>Floodgate</b>
<p>無需 Java 帳號即可登入</p>
</div>

<div class="card">
<b>穩定 API 狀態</b>
<p>即時伺服器在線監測</p>
</div>

</div>

<div class="card" style="margin-top:16px;">
<div class="ip">
<span>mcfenren.ddns.net:25565</span>
<button onclick="copyIP()">複製 IP</button>
</div>
</div>

</section>

<section class="section" id="map">
<div class="title">世界地圖</div>
<iframe src="http://mcfenren.ddns.net:8100"></iframe>
</section>

<footer>
mcfenren.ddns.net
</footer>

<script>
function copyIP(){
navigator.clipboard.writeText("mcfenren.ddns.net:25565");
alert("已複製 IP");
}

async function loadStatus(){
const el=document.getElementById("status");

try{
const res=await fetch("http://mcfenren.ddns.net:3000/status");
const data=await res.json();

if(data.online){
el.innerHTML='<div class="dot" style="background:#22c55e"></div><span>ONLINE</span>';
el.classList.add("show");
}else{
el.innerHTML='<div class="dot" style="background:#ef4444"></div><span>OFFLINE</span>';
el.classList.add("show");
}
}catch(e){
el.innerHTML='<div class="dot" style="background:#9ca3af"></div><span>UNKNOWN</span>';
el.classList.add("show");
}
}

loadStatus();
setInterval(loadStatus,5000);
</script>

</body>
</html>
